// Décodeur TopoJSON minimal (arcs delta-encodés -> anneaux GeoJSON).
function decodeTopoJSON(topology) {
  const transform = topology.transform;
  const scale = transform ? transform.scale : [1, 1];
  const translate = transform ? transform.translate : [0, 0];
  const arcs = topology.arcs.map((rawArc) => {
    let x = 0, y = 0;
    return rawArc.map(([dx, dy]) => { x += dx; y += dy; return [x * scale[0] + translate[0], y * scale[1] + translate[1]]; });
  });
  function getArc(i) { return i < 0 ? arcs[~i].slice().reverse() : arcs[i]; }
  function line(idxArr) {
    let coords = [];
    idxArr.forEach((i, k) => { const a = getArc(i); coords = coords.concat(k > 0 ? a.slice(1) : a); });
    return coords;
  }
  function polygon(rings) { return rings.map(line); }
  const key = Object.keys(topology.objects)[0];
  const obj = topology.objects[key];
  return obj.geometries.map((g) => {
    let coordinates = null;
    if (g.type === "Polygon") coordinates = polygon(g.arcs);
    else if (g.type === "MultiPolygon") coordinates = g.arcs.map(polygon);
    return { type: "Feature", id: g.id, properties: g.properties || {}, geometry: coordinates ? { type: g.type, coordinates } : null };
  }).filter((f) => f.geometry);
}

function hash(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }
function pseudoRand(a, b) { return (hash(a + "::" + b) % 1000) / 1000; }

function buildOrigin(gap, voa) {
  const gapSet = new Set(gap), voaSet = new Set(voa);
  const visaFree = ALL_NAMES.filter((n) => !gapSet.has(n) && !voaSet.has(n));
  return { visaFree, voa };
}

// Pour les passeports plus modestes, on construit l'accès à partir des mêmes
// blocs que les programmes CBI (Schengen / UK / Amérique du Nord / Asie-Pacifique
// avancée + une fraction du reste du monde) plutôt que d'énumérer un écart
// géant à la main — même logique, même niveau d'approximation assumé.
function buildOriginFromBlocs(seedId, { schengen = false, uk = false, northam = false, advApac = [], restFrac = 0 }) {
  const restPool = ALL_NAMES.filter((n) => !HARD_BLOCS.has(n));
  const set = new Set();
  if (schengen) SCHENGEN.forEach((c) => set.add(c));
  if (uk) UK_BLOC.forEach((c) => set.add(c));
  if (northam) NORTHAM.forEach((c) => set.add(c));
  advApac.forEach((c) => set.add(c));
  restPool.forEach((c) => { if (pseudoRand(seedId, c) < restFrac) set.add(c); });
  return { visaFree: [...set], voa: [] };
}

function accessSetFor(program, restOriginList) {
  const s = new Set();
  if (program.schengen) SCHENGEN.forEach((c) => s.add(c));
  if (program.uk) UK_BLOC.forEach((c) => s.add(c));
  if (program.northam) NORTHAM.forEach((c) => s.add(c));
  program.advApac.forEach((c) => s.add(c));
  restOriginList.forEach((c) => { if (pseudoRand(program.country, c) < program.restFrac) s.add(c); });
  (program.bonusGain || []).forEach((c) => s.add(c));
  if (program.country) s.add(program.country); // on a toujours accès à son propre pays
  return s;
}

function lostBlocsFor(program) {
  const lost = [];
  if (!program.schengen) lost.push(`Espace Schengen (${SCHENGEN.length} pays)`);
  if (!program.uk) lost.push("Royaume-Uni");
  if (!program.northam) lost.push("États-Unis et Canada");
  const missingApac = ADV_APAC.filter((c) => !program.advApac.includes(c));
  if (missingApac.length) lost.push(missingApac.join(", "));
  return lost;
}

// Palette "mélange de couleurs" : passeport 1 = bleu, 2 = jaune, 3 = rouge...
// Les combinaisons se mélangent comme des pigments (bleu+jaune=vert, etc.)
const PALETTE = ["#2C5C86", "#D9A62E", "#B23A2E", "#3F7A6B", "#7A4FA0", "#5B6B3E"];
const COMBO_COLORS = {
  "0": PALETTE[0], "1": PALETTE[1], "2": PALETTE[2], "3": PALETTE[3], "4": PALETTE[4], "5": PALETTE[5],
  "0,1": "#3F8F52", // bleu + jaune = vert
  "0,2": "#6B4C9A", // bleu + rouge = violet
  "1,2": "#E0812E", // jaune + rouge = orange
  "0,1,2": "#6B5B3E", // les trois = brun (mélange complet)
};
function blendFallback(indices) {
  let r = 0, g = 0, b = 0;
  indices.forEach((i) => {
    const hex = PALETTE[i % PALETTE.length].replace("#", "");
    r += parseInt(hex.substr(0, 2), 16); g += parseInt(hex.substr(2, 2), 16); b += parseInt(hex.substr(4, 2), 16);
  });
  const n = indices.length;
  return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
}
function colorForIndices(indices) {
  if (indices.length === 0) return null;
  const key = [...indices].sort((a, b) => a - b).join(",");
  return COMBO_COLORS[key] || blendFallback(indices);
}

// Cartogramme en grille : chaque destination occupe une case de grille
// proche de sa position géographique réelle (calculé une seule fois).
const GRID_COLS = 46, GRID_ROWS = 23;
function computeGridLayout() {
  const occupied = new Set(); const layout = {};
  DESTINATIONS.forEach((d) => {
    const c = COORDS[d.name]; if (!c) return;
    const [lon, lat] = c;
    let col = Math.max(0, Math.min(GRID_COLS - 1, Math.floor(((lon + 180) / 360) * GRID_COLS)));
    let row = Math.max(0, Math.min(GRID_ROWS - 1, Math.floor(((90 - lat) / 180) * GRID_ROWS)));
    let found = false;
    for (let radius = 0; radius < 8 && !found; radius++) {
      for (let dy = -radius; dy <= radius && !found; dy++) {
        for (let dx = -radius; dx <= radius && !found; dx++) {
          if (Math.max(Math.abs(dx), Math.abs(dy)) !== radius) continue;
          const cc = col + dx, rr = row + dy;
          if (cc < 0 || cc >= GRID_COLS || rr < 0 || rr >= GRID_ROWS) continue;
          const key = cc + "," + rr;
          if (!occupied.has(key)) { occupied.add(key); layout[d.name] = { col: cc, row: rr }; found = true; }
        }
      }
    }
    if (!found) layout[d.name] = { col, row };
  });
  return layout;
}
const GRID_LAYOUT = computeGridLayout();

function greedyReplace(originAccessSet, restOriginList, programs) {
  const remaining = new Set(originAccessSet);
  const chosen = [];
  while (remaining.size > 0) {
    let best = null, bestScore = Infinity, bestNew = 0;
    for (const p of programs) {
      if (chosen.includes(p.id)) continue;
      const access = accessSetFor(p, restOriginList);
      let n = 0;
      remaining.forEach((c) => access.has(c) && n++);
      if (n === 0) continue;
      const score = p.cost / n;
      if (score < bestScore) { bestScore = score; best = p; bestNew = n; }
    }
    if (!best) break;
    accessSetFor(best, restOriginList).forEach((c) => remaining.delete(c));
    chosen.push(best.id);
    if (bestNew === 0) break;
  }
  return chosen;
}

    return () => { cancelled = true; };
  }, []);

  const originData = ORIGIN_PASSPORTS[origin];
  const originAccess = useMemo(() => new Set([...originData.visaFree, ...originData.voa]), [originData]);
  const restOriginList = useMemo(() => [...originAccess].filter((c) => !HARD_BLOCS.has(c)), [originAccess]);

  // Ordre de sélection préservé (Set conserve l'ordre d'insertion) : sert à
  // attribuer la couleur "passeport n°1 / n°2 / n°3..." sur la carte.
  const selectedIds = useMemo(() => [...selected], [selected]);
  const selectedPrograms = useMemo(() => selectedIds.map((id) => ALL_PROGRAM_LIST.find((p) => p.id === id)).filter(Boolean), [selectedIds]);
  const accessSets = useMemo(() => selectedPrograms.map((p) => accessSetFor(p, restOriginList)), [selectedPrograms, restOriginList]);
  const unionAccess = useMemo(() => {
    const s = new Set();
    accessSets.forEach((set) => set.forEach((c) => s.add(c)));
    return s;
  }, [accessSets]);

  const lost = useMemo(() => [...originAccess].filter((c) => !unionAccess.has(c)), [originAccess, unionAccess]);
  const kept = originAccess.size - lost.length;
  const bonus = useMemo(() => [...unionAccess].filter((c) => !originAccess.has(c)), [unionAccess, originAccess]);
  const totalCost = selectedPrograms.reduce((s, p) => s + p.cost, 0);
  const replicationPct = Math.round((kept / originAccess.size) * 100);

  function toggleProgram(id) {
    setSelected((prev) => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  }
  function autoSelect() { setSelected(new Set(greedyReplace(originAccess, restOriginList, CBI_PROGRAMS))); }
  function resetSelection() { setSelected(new Set()); }

  return (
    <div style={S.page}>
      <style>{GLOBAL_CSS}</style>

      <header style={S.header}>
        <div style={S.stampBadge}><span style={S.stampPct}>{replicationPct}%</span><span style={S.stampWord}>COUVERT</span></div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={S.kicker}>Planification de nationalité</div>
          <h1 style={S.title}>Remplacer un passeport {origin}</h1>
          <div style={S.headerMetaRow}>
            <span>{originData.flag} <b>{origin}</b> comme référence</span>
            <span className="dot">·</span>
            <span>{selected.size} option{selected.size > 1 ? "s" : ""} retenue{selected.size > 1 ? "s" : ""}</span>
            <span className="dot">·</span>
            <span>{fmt(totalCost)}</span>
          </div>
        </div>
      </header>

      <nav style={S.tabs}>
        {TABS.map((t, i) => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ ...S.tabBtn, ...(tab === t.id ? S.tabBtnActive : {}) }}>
            <span style={S.tabIndex}>{String(i + 1).padStart(2, "0")}</span>{t.label}
          </button>
        ))}
      </nav>

      <main style={S.main}>
        {tab === "origin" && <OriginTab origin={origin} setOrigin={setOrigin} originData={originData} accessCount={originAccess.size} geo={geo} />}
        {tab === "programs" && (
          <ProgramsTab
            originAccess={originAccess} restOriginList={restOriginList} selected={selected} toggleProgram={toggleProgram}
            expanded={expanded} setExpanded={setExpanded} autoSelect={autoSelect} resetSelection={resetSelection}
            totalCost={totalCost} lostNames={lost} bonusNames={bonus} keptCount={kept}
          />
        )}
        {tab === "map" && (
          <MapTab originAccess={originAccess} restOriginList={restOriginList} selectedPrograms={selectedPrograms} accessSets={accessSets}
            totalCost={totalCost} replicationPct={replicationPct} lostNames={lost} bonusNames={bonus} geo={geo} />
        )}
      </main>

      <footer style={S.footer}>
        Échantillon pédagogique de {ALL_NAMES.length} destinations. Les blocs Schengen / Royaume-Uni / Amérique du Nord /
        Asie-Pacifique avancée sont modélisés précisément ; le reste du monde est une estimation de couverture par
        passeport (Henley Passport Index &amp; sites de programmes CBI, juillet 2026). À vérifier auprès d'un conseiller
        agréé avant toute décision réelle.
      </footer>
    </div>
  );
}

    if (voaSet.has(name)) return { fill: COLORS.accentGreen, opacity: 0.5 };
    return { fill: COLORS.missing, opacity: 0.12 };

  return (
    <section>
      <p className="lede" style={S.p}>

        <LedgerRow label="Destinations accessibles avec ce passeport (échantillon)" value={`${accessCount} / ${ALL_NAMES.length}`} />
      </div>
      <ExpandableList
        buttonLabel={`Voir le détail des ${accessCount} destinations accessibles`}
        groups={[
          { label: "Sans visa", names: originData.visaFree },
          { label: "Visa à l'arrivée / e-visa", names: originData.voa },

/* ---------------------------- Onglet 3 : carte du monde zoomable ---------------------------- */

function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

// Carte du monde réutilisable (zoom/pan, frontières réelles si dispo, repli
// en cartogramme sinon). `cellStyle(name)` retourne { fill, opacity }.
function WorldMapView({ geo, cellStyle, height = 320, emptyHint = "Touchez un pays pour voir son nom" }) {
  const [hover, setHover] = useState(null);
  const [view, setView] = useState({ scale: 1, tx: 0, ty: 0 });
  const dragging = useRef(false);
  const lastPos = useRef({ x: 0, y: 0 });
  const pinchDist = useRef(null);

  const cellW = 1000 / GRID_COLS, cellH = 500 / GRID_ROWS;

  const geoLayer = useMemo(() => {
    if (geo.status !== "ready") return null;
    try {
      const fc = { type: "FeatureCollection", features: geo.features };
      const projection = d3.geoEqualEarth().fitSize([1000, 500], fc);
      const pathGen = d3.geoPath(projection);
      const byCode = {};
      geo.features.forEach((f) => { if (f.id != null) byCode[String(Number(f.id))] = f; });
      const matched = {}; const unmatched = [];
      DESTINATIONS.forEach((d) => {
        const code = ISO_NUM[d.name];
        const feature = code != null ? byCode[String(code)] : null;
        const dPath = feature ? pathGen(feature) : null;
        if (dPath) matched[d.name] = dPath; else unmatched.push(d.name);
      });
      return { projection, matched, unmatched };
    } catch (e) {
      return null;
    }
  }, [geo]);

  function onMouseDown(e) { dragging.current = true; lastPos.current = { x: e.clientX, y: e.clientY }; }
  function onMouseMove(e) {
    if (!dragging.current) return;
    const dx = e.clientX - lastPos.current.x, dy = e.clientY - lastPos.current.y;
    lastPos.current = { x: e.clientX, y: e.clientY };
    setView((v) => ({ ...v, tx: v.tx + dx, ty: v.ty + dy }));
  }
  function onMouseUp() { dragging.current = false; }
  function onTouchStart(e) {
    if (e.touches.length === 1) { dragging.current = true; lastPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY }; pinchDist.current = null; }
    else if (e.touches.length === 2) {
      dragging.current = false;
      const [a, b] = e.touches;
      pinchDist.current = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), scale: view.scale };
    }
  }
  function onTouchMove(e) {
    if (e.touches.length === 2 && pinchDist.current) {
      const [a, b] = e.touches;
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      const ratio = pinchDist.current.d > 0 ? d / pinchDist.current.d : 1;
      setView((v) => ({ ...v, scale: clamp(pinchDist.current.scale * ratio, 0.7, 6) }));
    } else if (e.touches.length === 1 && dragging.current) {
      const dx = e.touches[0].clientX - lastPos.current.x, dy = e.touches[0].clientY - lastPos.current.y;
      lastPos.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      setView((v) => ({ ...v, tx: v.tx + dx, ty: v.ty + dy }));
    }
  }
  function onTouchEnd() { dragging.current = false; pinchDist.current = null; }
  function onWheel(e) { setView((v) => ({ ...v, scale: clamp(v.scale * (e.deltaY < 0 ? 1.15 : 0.87), 0.7, 6) })); }
  function zoomBy(f) { setView((v) => ({ ...v, scale: clamp(v.scale * f, 0.7, 6) })); }
  function resetView() { setView({ scale: 1, tx: 0, ty: 0 }); }

  return (
    <div style={S.mapWrap}>
      <div style={S.mapToolbar}>
        <button style={S.zoomBtn} onClick={() => zoomBy(1.3)}>+</button>
        <button style={S.zoomBtn} onClick={() => zoomBy(0.77)}>−</button>
        <button style={S.zoomBtn} onClick={resetView}>⟳</button>
      </div>
      <div
        style={{ ...S.mapViewport, height }}
        onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
        onWheel={onWheel}
      >
        <div style={{ transform: `translate(${view.tx}px,${view.ty}px) scale(${view.scale})`, transformOrigin: "center center", width: "100%", height: "100%" }}>
          <svg viewBox="0 0 1000 500" style={S.svg}>
            <rect x="0" y="0" width="1000" height="500" fill="#eef1ec" />
            {geoLayer ? (
              <>
                {DESTINATIONS.map((d) => {
                  const dAttr = geoLayer.matched[d.name]; if (!dAttr) return null;
                  const st = cellStyle(d.name);
                  return (
                    <path key={d.name} d={dAttr} fill={st.fill} opacity={st.opacity}
                      stroke={COLORS.ink} strokeOpacity="0.35" strokeWidth="0.6"
                      onClick={() => setHover(d.name)} onMouseEnter={() => setHover(d.name)}>
                      <title>{d.name}</title>
                    </path>
                  );
                })}
                {DESTINATIONS.filter((d) => geoLayer.unmatched.includes(d.name)).map((d) => {
                  const c = COORDS[d.name]; if (!c) return null;
                  const pt = geoLayer.projection(c); if (!pt) return null;
                  const st = cellStyle(d.name);
                  return (
                    <circle key={d.name} cx={pt[0]} cy={pt[1]} r="4.5" fill={st.fill} opacity={st.opacity}
                      stroke="#fff" strokeWidth="0.8"
                      onClick={() => setHover(d.name)} onMouseEnter={() => setHover(d.name)}>
                      <title>{d.name} (micro-État, marqueur)</title>
                    </circle>
                  );
                })}
              </>
            ) : (
              DESTINATIONS.map((d) => {
                const g = GRID_LAYOUT[d.name]; if (!g) return null;
                const st = cellStyle(d.name);
                return (
                  <rect key={d.name} x={g.col * cellW + 0.6} y={g.row * cellH + 0.6}
                    width={cellW - 1.2} height={cellH - 1.2} rx="1.2"
                    fill={st.fill} opacity={st.opacity}
                    stroke={COLORS.ink} strokeOpacity="0.18" strokeWidth="0.5"
                    onClick={() => setHover(d.name)} onMouseEnter={() => setHover(d.name)}>
                    <title>{d.name}</title>
                  </rect>
                );
              })
            )}
          </svg>
        </div>
      </div>
      <div style={S.mapHoverTag}>{hover || emptyHint}</div>
    </div>
  );
}

function MapTab({ originAccess, restOriginList, selectedPrograms, accessSets, totalCost, replicationPct, lostNames, bonusNames, geo }) {
  function coveringIndices(name) {
    const idx = [];
    accessSets.forEach((set, i) => { if (set.has(name)) idx.push(i); });
    return idx;
  }
  function cellStyle(name) {
    const idx = coveringIndices(name);
    const inOrigin = originAccess.has(name);
    if (idx.length > 0) return { fill: colorForIndices(idx), opacity: 1 };
    if (inOrigin) return { fill: COLORS.missing, opacity: 0.55 }; // perdu : grisé, opacité faible
    return { fill: COLORS.missing, opacity: 0.12 }; // jamais concerné : quasi invisible
  }

  return (
    <section>
      <p className="lede" style={S.p}>
        Carte du monde avec frontières réelles quand elles sont disponibles (sinon repli schématique).
        Glissez pour déplacer, pincez ou utilisez les boutons pour zoomer.
      </p>

      <div style={S.legend}>
        {selectedPrograms.map((p, i) => (
          <LegendItem key={p.id} color={PALETTE[i % PALETTE.length]} label={`${p.flag} ${p.country}`} />
        ))}
        {selectedPrograms.length >= 2 && <LegendItem color={COMBO_COLORS["0,1"]} label={`${selectedPrograms[0].flag}+${selectedPrograms[1].flag} combinés`} />}
        {selectedPrograms.length >= 3 && (
          <>
            <LegendItem color={COMBO_COLORS["0,2"]} label={`${selectedPrograms[0].flag}+${selectedPrograms[2].flag} combinés`} />
            <LegendItem color={COMBO_COLORS["1,2"]} label={`${selectedPrograms[1].flag}+${selectedPrograms[2].flag} combinés`} />
            <LegendItem color={COMBO_COLORS["0,1,2"]} label="Les 3 combinés" />
          </>
        )}
        <LegendItem color={COLORS.missing} label="Perdu (grisé)" />
      </div>

      <WorldMapView geo={geo} cellStyle={cellStyle} />

      <div style={S.ledger}>
        <LedgerRow label="Taux de remplacement" value={replicationPct + "%"} />
        <LedgerRow label="Passeports de remplacement" value={selectedPrograms.length ? selectedPrograms.map((p) => `${p.flag} ${p.country}`).join(", ") : "aucun"} />
        <LedgerRow label="Coût total estimé" value={fmt(totalCost)} />
        <LedgerRow label="Destinations perdues" value={lostNames.length} accent={lostNames.length ? COLORS.stampRed : COLORS.stampGreen} />
        <LedgerRow label="Destinations bonus" value={bonusNames.length} />
      </div>
      <ExpandableList
        buttonLabel={`Détail des ${lostNames.length} destinations perdues et des ${bonusNames.length} destinations bonus`}
        groups={[
          { label: "Perdues", names: lostNames },
          { label: "Bonus (nouvelles)", names: bonusNames },
        ]}
      />
    </section>
  );
}

function LegendItem({ color, label, opacity = 1 }) { return <div style={S.legendItem}><span style={{ ...S.legendSwatch, background: color, opacity }} />{label}</div>; }
function LedgerRow({ label, value, accent }) {
  return <div style={S.ledgerRow}><span style={S.ledgerLabel}>{label}</span><span style={{ ...S.ledgerValue, ...(accent ? { color: accent } : {}) }}>{value}</span></div>;
}
